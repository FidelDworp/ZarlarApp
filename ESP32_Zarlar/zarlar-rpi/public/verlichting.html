<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zarlar — Verlichting</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #0a0d12;
  --card:  #111620;
  --card2: #161d28;
  --bdr:   rgba(255,255,255,0.07);
  --text:  #e8eef4;
  --muted: #6b7f8e;
  --dim:   #1e2a36;
  --green: #00d18c;
  --amber: #ffb030;
  --red:   #ff4555;
  --blue:  #4da6ff;
  --font:  'DM Sans', sans-serif;
  --mono:  'DM Mono', monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; min-height:100%; }

/* HEADER */
.hdr { display:flex; align-items:center; gap:10px; padding:14px 16px 12px; border-bottom:1px solid var(--bdr); }
.back { width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--bdr);
  display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; color:var(--muted); }
.back:hover { color:var(--text); border-color:rgba(255,255,255,0.15); }
.hdr-title { flex:1; }
.hdr-title h1 { font-size:16px; font-weight:600; }
.hdr-title p  { font-size:11px; color:var(--muted); margin-top:1px; font-family:var(--mono); }
.refresh-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  font-family: var(--mono);
  padding: 6px 12px;
  cursor: pointer;
  transition: background 0.15s;
}
.refresh-btn:hover { background: rgba(255,255,255,0.12); }

/* CONTENT */
.content { padding: 14px; max-width: 1200px; margin: 0 auto; }

/* SCENES SECTIE (voor later) */
.scenes-section {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.scenes-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .6px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.scenes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.scene-btn {
  background: var(--card2);
  border: 1px solid var(--bdr);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.scene-btn:hover {
  background: var(--dim);
  border-color: rgba(255,255,255,0.15);
}
.scene-icon {
  font-size: 24px;
  margin-bottom: 6px;
}
.scene-name {
  font-size: 12px;
  font-weight: 500;
}

/* ROOMS CONTAINER */
#rooms-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ROOM CARD */
.room-card {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 14px;
  overflow: hidden;
}
.room-header {
  padding: 12px 16px;
  background: var(--card2);
  border-bottom: 1px solid var(--bdr);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.room-name {
  font-size: 14px;
  font-weight: 600;
}
.room-status {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
}
.room-online { color: var(--green); }
.room-offline { color: var(--red); }

.room-body {
  padding: 16px;
}

/* PIXELS GRID */
.pixels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

/* TOGGLE SWITCH */
.toggle-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: var(--card2);
  border: 1px solid var(--bdr);
  border-radius: 8px;
  transition: background 0.2s;
}
.toggle-item:hover {
  background: var(--dim);
}
.toggle-label {
  font-size: 13px;
  flex: 1;
}
.toggle-switch {
  position: relative;
  width: 44px;
  height: 24px;
  background: #2a3f5f;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-switch.on {
  background: var(--green);
}
.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle-switch.on .toggle-knob {
  transform: translateX(20px);
}

/* COLOR PICKER */
.color-section {
  padding-top: 12px;
  border-top: 1px solid var(--bdr);
}
.color-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .6px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.color-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.color-preview {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  border: 2px solid var(--bdr);
  cursor: pointer;
  transition: transform 0.2s;
}
.color-preview:hover {
  transform: scale(1.05);
}
.color-picker-wrapper {
  position: relative;
}
.color-picker-input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}
.color-values {
  display: flex;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
}
.color-value {
  padding: 4px 8px;
  background: var(--card2);
  border: 1px solid var(--bdr);
  border-radius: 4px;
}
.color-value span {
  color: var(--muted);
  margin-right: 4px;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-size: 13px;
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}
.empty-text {
  font-size: 14px;
  margin-bottom: 6px;
}
.empty-sub {
  font-size: 12px;
  color: #4a5568;
}

@media (max-width: 600px) {
  .pixels-grid {
    grid-template-columns: 1fr;
  }
  .color-controls {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>
<body>

<div class="hdr">
  <a href="/" class="back">←</a>
  <div class="hdr-title">
    <h1>Verlichting</h1>
    <p id="status-txt">Alle kamers</p>
  </div>
  <button class="refresh-btn" onclick="loadRooms()">↻ Vernieuwen</button>
</div>

<div class="content">

  <!-- SCENES SECTIE (voor later) -->
  <div class="scenes-section" style="display:none;" id="scenes-section">
    <div class="scenes-header">🎬 Scenes (binnenkort)</div>
    <div class="scenes-grid">
      <div class="scene-btn">
        <div class="scene-icon">🎥</div>
        <div class="scene-name">Filmavond</div>
      </div>
      <div class="scene-btn">
        <div class="scene-icon">🍽️</div>
        <div class="scene-name">Diner</div>
      </div>
      <div class="scene-btn">
        <div class="scene-icon">📚</div>
        <div class="scene-name">Lezen</div>
      </div>
      <div class="scene-btn">
        <div class="scene-icon">🌙</div>
        <div class="scene-name">Nacht</div>
      </div>
    </div>
  </div>

  <!-- ROOMS CONTAINER -->
  <div id="rooms-container">
    <div class="loading">
      <div style="font-size:24px;margin-bottom:8px;">⚡</div>
      Kamers laden...
    </div>
  </div>

</div>

<script>
'use strict';

// ─── ROOM CONFIGURATIE ──────────────────────────────────────────────────────
const ROOMS = [
  { id: 75, name: 'Bed & Breakfast', active: false },
  { id: 76, name: 'Badkamer', active: false },
  { id: 77, name: 'Inkomhal', active: false },
  { id: 78, name: 'Keuken', active: false },
  { id: 79, name: 'Wasplaats', active: false },
  { id: 80, name: 'Eetplaats', active: true },  // Enige actieve room
  { id: 81, name: 'Zitplaats', active: false }
];

// ─── ROOM DATA OPHALEN ──────────────────────────────────────────────────────
async function loadRooms() {
  const container = document.getElementById('rooms-container');
  container.innerHTML = '<div class="loading"><div style="font-size:24px;margin-bottom:8px;">⚡</div>Kamers laden...</div>';

  const activeRooms = [];

  // Poll elke room
  for (const room of ROOMS) {
    try {
      const resp = await fetch(`/api/poll/room${room.id}`);
      if (resp.ok) {
        const data = await resp.json();
        
        // Haal capabilities op voor nicknames
        let capabilities = null;
        try {
          const capResp = await fetch(`/api/capabilities/room${room.id}`);
          if (capResp.ok) {
            capabilities = await capResp.json();
          }
        } catch (err) {
          console.log('Capabilities niet beschikbaar voor room', room.id);
        }
        
        activeRooms.push({ ...room, data, capabilities, online: true });
      } else {
        // Room bestaat maar is offline
        if (room.active) {
          activeRooms.push({ ...room, data: null, capabilities: null, online: false });
        }
      }
    } catch (err) {
      // Room niet bereikbaar
      if (room.active) {
        activeRooms.push({ ...room, data: null, capabilities: null, online: false });
      }
    }
  }

  // Render rooms
  if (activeRooms.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💡</div>
        <div class="empty-text">Geen actieve room controllers gevonden</div>
        <div class="empty-sub">Activeer controllers in het Dashboard</div>
      </div>
    `;
    return;
  }

  container.innerHTML = activeRooms.map(room => renderRoom(room)).join('');
}

// ─── ROOM CARD RENDEREN ─────────────────────────────────────────────────────
function renderRoom(room) {
  if (!room.online || !room.data) {
    return `
      <div class="room-card">
        <div class="room-header">
          <div class="room-name">${room.name}</div>
          <div class="room-status room-offline">● offline</div>
        </div>
        <div class="room-body">
          <div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">
            Controller niet bereikbaar
          </div>
        </div>
      </div>
    `;
  }

  const data = room.data;
  const caps = room.capabilities;
  
  // Parse pixel_on string (bv. "P=00111000")
  const pixelStr = (data.t || '').replace('P=', '');
  const totalPixels = pixelStr.length;
  
  // Maak pixel toggles met nicknames
  const pixels = [];
  
  // Pixel 0 (MOV override of eerste pixel)
  if (totalPixels > 0) {
    const nickname = caps?.pixels?.[0] || `${room.name} Pixel 0`;
    pixels.push({
      index: 0,
      on: pixelStr[0] === '1',
      nickname: nickname,
      type: 'sw1'
    });
  }
  
  // Pixel 1 (individueel)
  if (totalPixels > 1) {
    const nickname = caps?.pixels?.[1] || `${room.name} Pixel 1`;
    pixels.push({
      index: 1,
      on: pixelStr[1] === '1',
      nickname: nickname,
      type: 'sw2'
    });
  }
  
  // Pixels 2+ (gegroepeerd)
  if (totalPixels > 2) {
    const nickname = caps?.pixels?.[2] || `${room.name} Pixel 2`;
    const label = totalPixels > 3 ? `${nickname}+` : nickname;
    const anyOn = pixelStr.slice(2).includes('1');
    pixels.push({
      index: 2,
      on: anyOn,
      nickname: label,
      type: 'sw3'
    });
  }

  // RGB kleuren
  const r = parseInt(data.q) || 0;
  const g = parseInt(data.r) || 0;
  const b = parseInt(data.s) || 0;
  const hexColor = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;

  return `
    <div class="room-card">
      <div class="room-header">
        <div class="room-name">${room.name}</div>
        <div class="room-status room-online">● online</div>
      </div>
      <div class="room-body">
        
        <!-- PIXELS -->
        <div class="pixels-grid">
          ${pixels.map(p => `
            <div class="toggle-item">
              <div class="toggle-label">${p.nickname}</div>
              <div class="toggle-switch ${p.on ? 'on' : ''}" 
                   onclick="togglePixel(${room.id}, '${p.type}', ${!p.on})">
                <div class="toggle-knob"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- KLEURKIEZER -->
        <div class="color-section">
          <div class="color-header">🎨 Kleur alle pixels</div>
          <div class="color-controls">
            <div class="color-picker-wrapper">
              <div class="color-preview" 
                   style="background:${hexColor}"
                   onclick="document.getElementById('picker-${room.id}').click()">
              </div>
              <input type="color" 
                     id="picker-${room.id}" 
                     class="color-picker-input"
                     value="${hexColor}"
                     onchange="setColor(${room.id}, this.value)">
            </div>
            <div class="color-values">
              <div class="color-value"><span>R</span>${r}</div>
              <div class="color-value"><span>G</span>${g}</div>
              <div class="color-value"><span>B</span>${b}</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;
}

// ─── PIXEL TOGGLE ───────────────────────────────────────────────────────────
async function togglePixel(roomId, switchType, state) {
  try {
    const resp = await fetch(`/api/set/room${roomId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        [switchType]: state ? 1 : 0
      })
    });
    
    if (resp.ok) {
      // Reload na 200ms voor feedback
      setTimeout(loadRooms, 200);
    } else {
      console.error('Toggle failed:', await resp.text());
    }
  } catch (err) {
    console.error('Toggle error:', err);
  }
}

// ─── KLEUR INSTELLEN ────────────────────────────────────────────────────────
async function setColor(roomId, hexColor) {
  // Hex naar RGB
  const r = parseInt(hexColor.slice(1, 3), 16);
  const g = parseInt(hexColor.slice(3, 5), 16);
  const b = parseInt(hexColor.slice(5, 7), 16);

  try {
    const resp = await fetch(`/api/set/room${roomId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ r, g, b })
    });
    
    if (resp.ok) {
      setTimeout(loadRooms, 200);
    } else {
      console.error('Color set failed:', await resp.text());
    }
  } catch (err) {
    console.error('Color set error:', err);
  }
}

// ─── INIT ───────────────────────────────────────────────────────────────────
loadRooms();
setInterval(loadRooms, 10000); // Auto-refresh elke 10s
</script>

</body>
</html>
