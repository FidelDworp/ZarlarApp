<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verlichting — Zarlar Portal</title>
  <link rel="stylesheet" href="zarlar.css">
  <style>
    .rooms-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .room-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .room-status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .room-online {
      background: #10b98120;
      color: #10b981;
    }

    .room-offline {
      background: #ef444420;
      color: #ef4444;
    }

    .pixels-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .toggle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .toggle-label {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 28px;
      background: #4b5563;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-switch.on {
      background: #10b981;
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch.on .toggle-knob {
      transform: translateX(22px);
    }

    .color-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .color-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .color-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .color-picker-wrapper {
      position: relative;
    }

    .color-preview {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .color-preview:active {
      transform: scale(0.95);
    }

    .color-picker-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .color-values {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .color-value {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      font-size: 13px;
      color: var(--text);
    }

    .color-value span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='/'">←</button>
        <div>
          <h1>Verlichting</h1>
          <p class="subtitle">Alle kamers</p>
        </div>
      </div>
      <div class="header-right">
        <button class="refresh-btn" onclick="loadRooms()">↻ Vernieuwen</button>
      </div>
    </header>

    <main id="rooms-container" class="rooms-container">
      <div class="loading">
        <div style="font-size:24px;margin-bottom:8px;">⚡</div>
        Kamers laden...
      </div>
    </main>
  </div>

  <script>
// ─── AUTO-DISCOVERY VAN ACTIEVE ROOMS ──────────────────────────────────────
async function discoverRooms() {
  try {
    const resp = await fetch('/api/status');
    if (!resp.ok) throw new Error('Status API unavailable');
    
    const status = await resp.json();
    const rooms = [];
    
    // Filter alleen room controllers
    for (const [name, info] of Object.entries(status)) {
      if (name.startsWith('room')) {
        const id = name.replace('room', '');
        rooms.push({
          id: parseInt(id),
          name: getRoomName(id),
          online: info.online
        });
      }
    }
    
    // Sorteer op ID
    return rooms.sort((a, b) => a.id - b.id);
    
  } catch (err) {
    console.error('Room discovery failed:', err);
    return [{ id: 80, name: 'Eetplaats', online: false }];
  }
}

// ─── ROOM NAAM MAPPING ─────────────────────────────────────────────────────
function getRoomName(id) {
  const names = {
    75: 'B&B',
    76: 'Badkamer',
    77: 'Inkomhal',
    78: 'Keuken',
    79: 'Wasplaats',
    80: 'Eetplaats',
    81: 'Zitplaats'
  };
  return names[id] || `Room ${id}`;
}

// ─── ROOM DATA OPHALEN MET ERROR HANDLING ──────────────────────────────────
async function loadRooms() {
  const container = document.getElementById('rooms-container');
  container.innerHTML = '<div class="loading"><div style="font-size:24px;margin-bottom:8px;">⚡</div>Kamers laden...</div>';

  const discoveredRooms = await discoverRooms();
  const activeRooms = [];

  for (const room of discoveredRooms) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000);
      
      const resp = await fetch(`/api/poll/room${room.id}`, {
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      
      if (resp.ok) {
        const data = await resp.json();
        
        let capabilities = null;
        try {
          const capResp = await fetch(`/api/capabilities/room${room.id}`);
          if (capResp.ok) {
            capabilities = await capResp.json();
          }
        } catch (err) {
          console.log(`Capabilities niet beschikbaar voor room${room.id}`);
        }
        
        activeRooms.push({ ...room, data, capabilities, online: true });
      } else {
        activeRooms.push({ ...room, data: null, capabilities: null, online: false });
      }
    } catch (err) {
      console.log(`Room${room.id} niet bereikbaar:`, err.message);
      activeRooms.push({ ...room, data: null, capabilities: null, online: false });
    }
  }

  if (activeRooms.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💡</div>
        <div class="empty-text">Geen room controllers gevonden</div>
        <div class="empty-sub">Check de Dashboard controller</div>
      </div>
    `;
    return;
  }

  container.innerHTML = activeRooms.map(room => renderRoom(room)).join('');
}

// ─── ROOM CARD RENDEREN ─────────────────────────────────────────────────────
function renderRoom(room) {
  if (!room.online || !room.data) {
    return `
      <div class="room-card">
        <div class="room-header">
          <div class="room-name">${room.name}</div>
          <div class="room-status room-offline">● offline</div>
        </div>
        <div class="room-body">
          <div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">
            Controller niet bereikbaar
          </div>
        </div>
      </div>
    `;
  }

  const data = room.data;
  const caps = room.capabilities;
  
  const pixelStr = (data.t || '').replace('P=', '');
  const totalPixels = pixelStr.length;
  
  const pixels = [];
  
  if (totalPixels > 0) {
    const nickname = caps?.pixels?.[0] || `${room.name} Pixel 0`;
    pixels.push({
      index: 0,
      on: pixelStr[0] === '1',
      nickname: nickname,
      type: 'sw1'
    });
  }
  
  if (totalPixels > 1) {
    const nickname = caps?.pixels?.[1] || `${room.name} Pixel 1`;
    pixels.push({
      index: 1,
      on: pixelStr[1] === '1',
      nickname: nickname,
      type: 'sw2'
    });
  }
  
  if (totalPixels > 2) {
    const nickname = caps?.pixels?.[2] || `${room.name} Pixel 2`;
    const label = totalPixels > 3 ? `${nickname}+` : nickname;
    const anyOn = pixelStr.slice(2).includes('1');
    pixels.push({
      index: 2,
      on: anyOn,
      nickname: label,
      type: 'sw3'
    });
  }

  const r = parseInt(data.q) || 0;
  const g = parseInt(data.r) || 0;
  const b = parseInt(data.s) || 0;
  const hexColor = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;

  return `
    <div class="room-card">
      <div class="room-header">
        <div class="room-name">${room.name}</div>
        <div class="room-status room-online">● online</div>
      </div>
      <div class="room-body">
        
        <div class="pixels-grid">
          ${pixels.map(p => `
            <div class="toggle-item">
              <div class="toggle-label">${p.nickname}</div>
              <div class="toggle-switch ${p.on ? 'on' : ''}" 
                   onclick="togglePixel(${room.id}, '${p.type}', ${!p.on})">
                <div class="toggle-knob"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="color-section">
          <div class="color-header">🎨 Kleur alle pixels</div>
          <div class="color-controls">
            <div class="color-picker-wrapper">
              <div class="color-preview" 
                   style="background:${hexColor}"
                   onclick="document.getElementById('picker-${room.id}').click()">
              </div>
              <input type="color" 
                     id="picker-${room.id}" 
                     class="color-picker-input"
                     value="${hexColor}"
                     onchange="setColor(${room.id}, this.value)">
            </div>
            <div class="color-values">
              <div class="color-value"><span>R</span>${r}</div>
              <div class="color-value"><span>G</span>${g}</div>
              <div class="color-value"><span>B</span>${b}</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;
}

// ─── PIXEL TOGGLE (GEEN RELOAD MEER) ───────────────────────────────────────
async function togglePixel(roomId, switchType, state) {
  try {
    const resp = await fetch(`/api/set/room${roomId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        [switchType]: state ? 1 : 0
      })
    });
    
    if (!resp.ok) {
      console.error('Toggle failed:', await resp.text());
    }
  } catch (err) {
    console.error('Toggle error:', err);
  }
}

// ─── KLEUR INSTELLEN (GEEN RELOAD MEER) ────────────────────────────────────
async function setColor(roomId, hexColor) {
  try {
    const r = parseInt(hexColor.slice(1, 3), 16);
    const g = parseInt(hexColor.slice(3, 5), 16);
    const b = parseInt(hexColor.slice(5, 7), 16);
    
    const resp = await fetch(`/api/set/room${roomId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ r, g, b })
    });
    
    if (!resp.ok) {
      console.error('Color set failed:', await resp.text());
    }
  } catch (err) {
    console.error('Color set error:', err);
  }
}

// ─── INITIALISATIE ──────────────────────────────────────────────────────────
loadRooms();
  </script>
</body>
</html>
